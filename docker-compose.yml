services:
  db:
    image: postgres:16-alpine
    container_name: checkers-postgres
    environment:
      POSTGRES_DB: checkers
      POSTGRES_USER: checkers
      POSTGRES_PASSWORD: checkers
    ports:
      - "5433:5432"
    volumes:
      - checkers-pg:/var/lib/postgresql/data
      - ./server/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkers -d checkers"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8787:8787"
    environment:
      DATABASE_URL: postgres://checkers:checkers@db:5432/checkers
      PORT: "8787"
    depends_on:
      db:
        condition: service_healthy

volumes:
  checkers-pg:
