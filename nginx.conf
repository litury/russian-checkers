server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;
	gzip on;
	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 5;
	gzip_min_length 1024;
	gzip_types application/javascript text/javascript text/css;
	# Vite content-hashed assets are immutable; never cache a missing asset as HTML.
	location ^~ /assets/ {
		open_file_cache max=1000 inactive=60s;
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}
	# Keep HTML outside open_file_cache so atomic replacements are visible immediately.
	location = /index.html {
		add_header Cache-Control "no-cache";
		try_files $uri =404;
	}
	location ~* \.(?:js|mjs|css|map|webp|png|jpe?g|gif|svg|ico|woff2?|ogg|mp3|wav|webm)$ {
		try_files $uri =404;
	}
	location / {
		# SPA fallback also serves the entry HTML: it must revalidate too,
		# otherwise a browser can serve a stale app shell from cache.
		add_header Cache-Control "no-cache";
		try_files $uri $uri/ /index.html;
	}
}
